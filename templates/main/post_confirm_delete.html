{% extends "base.html" %}

{% block title %}Удалить статью{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card border-danger shadow-sm">
            <div class="card-body">
                <h1 class="h4 text-danger">Удалить статью?</h1>
                <p>Вы уверены, что хотите удалить <strong>«{{ post.title }}»</strong>? Это действие необратимо.</p>

                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Да, удалить</button>
                    <a href="{{ post.get_absolute_url }}" class="btn btn-outline-secondary">Отмена</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
